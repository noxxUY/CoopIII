; CoopIII. Put this next to CoopIII.asi.
;
; Every line here is optional. With no file at all CoopIII connects to a server
; on this machine as "Player", which is a working single-machine setup.

[CoopIII]

; Server to connect to. Hostname or IP.
host = 127.0.0.1

; Server port. Must match the server's.
port = 2001

; Your name, as other players see it. Up to 23 characters; control characters
; are stripped.
nick = Player

; Write CoopIII.log next to the .asi. Leave this on unless you have a reason:
; with an ASI loader, SilentPatch, Mod Loader and CLEO all patching the same
; game, the log is usually the only thing that explains a failed start.
logToFile = true

; How big the names over other players are drawn, as a multiple of the
; built-in size. The built-in one is a fixed fraction of screen height, so it
; already looks the same at any resolution; this is just taste. Between 0.25
; and 4.0, anything outside that is ignored.
nametagScale = 1.0
